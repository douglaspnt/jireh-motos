<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Serviços - Jireh Motos</title>
  <meta name="description" content="Conheça todos os serviços da Jireh Motos: venda, compra, consignação, motos zero, parcelamento, financiamento e troca de motocicleta.">
  <link rel="icon" href="img/logo.jpg" type="image/jpg">
  
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:'Montserrat', sans-serif;}
    body {background:#000; color:#fff; overflow-x:hidden; min-height:100vh;}

    header {
      position:fixed;
      top:0; left:0; width:100%;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      min-height:82px;
      padding:10px clamp(14px, 4vw, 30px);
      z-index:1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      gap:12px;
    }
    .logo-area {display:flex; align-items:center; gap:12px; min-width:0;}
    .logo-area img {height:clamp(48px, 8vw, 60px); width:clamp(48px, 8vw, 60px); object-fit:contain;}
    .logo-area h1 {font-family:'Bebas Neue', sans-serif; font-size:clamp(2rem, 6vw, 2.8rem); color:#000; letter-spacing:2px; white-space:nowrap;}

    .faixa-vermelha {
      width:100%; height:6px;
      background:linear-gradient(90deg, #d40000, #ff4c4c);
      position:fixed; top:82px; left:0; z-index:999;
      animation: moveGradient 5s linear infinite;
    }
    @keyframes moveGradient {0%{background-position:0% 0%;} 100%{background-position:100% 0%;}}

    .sidebar {
      position:fixed; top:96px; right:min(-260px, -86vw); width:min(260px, 86vw);
      background:#111; padding:1.5rem; border-radius:10px 0 0 10px;
      transition:0.4s; z-index:1001;
      display:flex; flex-direction:column; gap:1.5rem; height:auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .sidebar.active {right:0;}
    .sidebar a {
      color:#fff; font-size:1.2rem; text-decoration:none; font-weight:bold;
      transition:0.3s;
    }
    .sidebar a:hover {color:#d40000; transform:scale(1.05);}

    .menu-btn {
      background:#fff; color:#000; border:none;
      padding:12px clamp(22px, 6vw, 40px); font-size:clamp(0.95rem, 3vw, 1.2rem); font-weight:bold; border-radius:12px;
      cursor:pointer; transition:0.3s; box-shadow:0 5px 15px rgba(0,0,0,0.5);
    }
    .menu-btn:hover {background:#d40000; color:#fff; box-shadow:0 0 30px rgba(255,0,0,0.7);}

    main {margin-top:88px;}
    .services-section {
      text-align:center; 
      padding:clamp(3rem, 9vw, 6rem) clamp(1rem, 4vw, 2rem);
    }
    .services-section h2 {
      font-size:clamp(2rem, 8vw, 3rem);
      margin-bottom:clamp(2rem, 8vw, 4rem);
      color:#fff;
      text-shadow:0 0 15px #fff;
      line-height:1.1;
    }

    .services-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      gap: clamp(1rem, 3vw, 2rem);
      width:100%;
      max-width:1180px;
      margin:0 auto;
    }

    .service-card {
      background: #fff;
      color: #000;
      padding: clamp(1rem, 3vw, 1.25rem);
      border-radius: 8px;
      font-weight: bold;
      font-size: clamp(1rem, 3.2vw, 1.25rem);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 0.5rem;
      transition: transform 0.3s, box-shadow 0.3s;
      box-shadow: 0 0 12px #fff;
      min-height:86px;
      line-height:1.25;
      overflow-wrap:anywhere;
    }
    .service-card:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 0 20px #fff;
    }

    .whatsapp-float {
      position:fixed; bottom:clamp(18px, 4vw, 30px); right:clamp(18px, 4vw, 30px);
      width:clamp(56px, 14vw, 70px); height:clamp(56px, 14vw, 70px); border-radius:50%;
      background:#25D366; color:#fff;
      font-size:clamp(2rem, 8vw, 2.5rem); display:flex; align-items:center; justify-content:center; z-index:1000;
      transition:0.3s;
    }
    .whatsapp-float:hover {transform:scale(1.2);}

    @media(max-width:600px){
      header {min-height:76px;}
      .logo-area h1 {letter-spacing:1px;}
      .menu-btn {padding:10px 16px;}
      .faixa-vermelha {top:76px;}
      .sidebar {top:84px;}
      main {margin-top:82px;}
      .services-section {padding-bottom:6rem;}
    }

    @media(max-width:380px){
      header {padding-left:10px; padding-right:10px;}
      .logo-area {gap:8px;}
      .menu-btn {font-size:0.85rem; padding:9px 12px;}
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <img src="img/logo.png" alt="Logo Jireh">
      <h1>JIREH MOTOS</h1>
    </div>
    <button class="menu-btn" id="menuBtn">MENU</button>
  </header>

  <div class="faixa-vermelha"></div>

  <div class="sidebar" id="sidebar">
    <a href="index.html"><i class="fas fa-home"></i> Home</a>
    <a href="servicos.html"><i class="fas fa-tools"></i> Serviços</a>
    <a href="contato.html"><i class="fas fa-phone-alt"></i> Contato</a>
  </div>

  <main>
    <section class="services-section">
      <h2>Nossos Serviços</h2>
      <div class="services-cards">
        <div class="service-card">🛵 Venda de Motos</div>
        <div class="service-card">💸 Compra de Motos</div>
        <div class="service-card">🔁 Consignação</div>
        <div class="service-card">🏍️ Motos Zero KM</div>
        <div class="service-card">💳 Parcelamos em até 24x no cartão</div>
        <div class="service-card">💰 Financiamento</div>
        <div class="service-card">🔄 Aceita Motocicleta na Troca</div>
        <div class="service-card">🏠 Entregamos seu veículo em casa</div>
        <div class="service-card">🖥️ Venda 100% Online</div>
      </div>
    </section>
  </main>

  <a href="https://wa.me/5511989488282" target="_blank" class="whatsapp-float">
    <i class="fab fa-whatsapp"></i>
  </a>

  <script>
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');

    menuBtn.addEventListener('click', e=>{
      e.stopPropagation();
      sidebar.classList.toggle('active');
    });

    document.addEventListener('click', e=>{
      if(!sidebar.contains(e.target) && !menuBtn.contains(e.target)){
        sidebar.classList.remove('active');
      }
    });
  </script>

</body>
</html>
