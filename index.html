<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIREH MOTOS</title>
  <meta name="description" content="Seu sonho em duas rodas está aqui - Concessionária de motos novas e seminovas.">
  
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }
    body {
      background: #000;
      color: #fff;
      overflow-x: hidden;
      min-height: 100vh;
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 82px;
      padding: 10px clamp(14px, 4vw, 28px);
      z-index: 1100;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      gap: 10px 20px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-area img {
      height: clamp(48px, 8vw, 60px);
      width: clamp(48px, 8vw, 60px);
      object-fit: contain;
    }

    .logo-area h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2rem, 6vw, 2.4rem);
      color: #000;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .header-right {
      font-size: 1rem;
      color: #555;
      font-weight: 500;
      line-height: 1.3;
      text-align: right;
    }

    /* FAIXA VERMELHA (corrigida) */
    .faixa-vermelha {
      position: fixed;
      top: 82px; /* logo abaixo do header */
      left: 0;
      width: 100%;
      height: 6px;
      background: linear-gradient(90deg, #d40000, #ff4c4c);
      background-size: 200% auto;
      animation: brilhoFaixa 4s linear infinite;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
      z-index: 1050;
    }

    @keyframes brilhoFaixa {
      0% {background-position: 0% 0%;}
      100% {background-position: 200% 0%;}
    }

    .carousel {
      position: relative;
      width: 100%;
      height: calc(100svh - 88px);
      min-height: 420px;
      margin-top: 88px; /* altura exata do header + faixa */
      overflow: hidden;
      z-index: 1;
      background: #000;
    }

    .carousel::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: var(--carousel-bg);
      background-size: cover;
      background-position: center;
      filter: blur(22px);
      transform: scale(1.08);
      opacity: 0;
      transition: opacity 0.5s ease, background-image 0.5s ease;
      z-index: 0;
    }

    .carousel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,0.65), rgba(0,0,0,0.08) 28%, rgba(0,0,0,0.08) 72%, rgba(0,0,0,0.65));
      z-index: 1;
      pointer-events: none;
    }

    .carousel img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      user-select: none;
      pointer-events: none;
      z-index: 2;
    }

    .carousel img.active {
      opacity: 1;
      pointer-events: auto;
    }

    @media (min-width: 1024px) {
      .carousel::before {
        opacity: 0.7;
      }

      .carousel img {
        object-fit: contain;
        padding: clamp(18px, 2.5vw, 34px) clamp(70px, 12vw, 180px);
      }
    }

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: clamp(1.4rem, 4vw, 2.5rem);
      color: #fff;
      background: rgba(0,0,0,0.4);
      width: clamp(40px, 9vw, 56px);
      height: clamp(40px, 9vw, 56px);
      display: grid;
      place-items: center;
      padding: 0;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      transition: background 0.3s;
      user-select: none;
    }

    .arrow:hover {
      background: rgba(212,0,0,0.8);
    }

    .arrow.left { left: 15px; }
    .arrow.right { right: 15px; }

    .overlay {
      position: absolute;
      bottom: clamp(28px, 9vh, 80px);
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 0 15px;
      animation: fadeInUp 1.5s ease forwards;
      z-index: 20;
    }

    @keyframes fadeInUp {
      0% {opacity: 0; transform: translateY(30px);}
      100% {opacity: 1; transform: translateY(0);}
    }

    .frase {
      max-width: min(92vw, 760px);
      font-size: clamp(1.15rem, 4vw, 1.6rem);
      font-weight: 600;
      font-style: italic;
      color: #fff;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
      line-height: 1.3;
    }

    .saiba-mais {
      background: linear-gradient(90deg, #d40000, #ff4c4c);
      padding: 14px clamp(20px, 6vw, 28px);
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }

    .saiba-mais a {
      text-decoration: none;
      color: #fff;
      font-size: clamp(1rem, 3.5vw, 1.3rem);
      font-weight: 700;
      display: block;
      user-select: none;
    }

    .saiba-mais:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(255,0,0,0.7);
    }

    .menu-btn {
      margin-top: 10px;
      background: #fff;
      color: #000;
      border: none;
      padding: 14px clamp(34px, 13vw, 50px);
      font-size: clamp(1rem, 3.5vw, 1.2rem);
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      transition: background 0.3s, color 0.3s, box-shadow 0.3s;
      user-select: none;
    }

    .menu-btn:hover {
      background: #d40000;
      color: #fff;
      box-shadow: 0 0 30px rgba(255,0,0,0.7);
    }

    .sidebar {
      position: fixed;
      top: 15%;
      right: min(-260px, -86vw);
      width: min(260px, 86vw);
      background: #111;
      padding: 1.5rem;
      border-radius: 10px 0 0 10px;
      transition: right 0.4s ease;
      z-index: 1200;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    .sidebar.active { right: 0; }

    .sidebar a {
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.2rem;
      transition: transform 0.3s, color 0.3s;
    }

    .sidebar a:hover {
      color: #d40000;
      transform: scale(1.05);
    }

    @media (max-width: 768px) {
      header {
        min-height: 104px;
        padding: 8px 14px;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .logo-area {
        flex-direction: row;
        gap: 10px;
        justify-content: center;
      }

      .header-right {
        display: block;
        font-size: clamp(0.78rem, 3vw, 0.9rem);
        color: #000;
        white-space: normal;
        text-align: center;
        line-height: 1.2;
        max-width: 94%;
      }

      .faixa-vermelha {
        top: 104px; /* ajuste no mobile */
      }

      .carousel {
        height: calc(100svh - 110px);
        min-height: 500px;
        margin-top: 110px;
      }

      .arrow.left { left: 8px; }
      .arrow.right { right: 8px; }

      .sidebar {
        top: 112px;
      }
    }

    @media (max-width: 420px) {
      .logo-area {
        gap: 8px;
      }

      .header-right {
        display: none;
      }

      header {
        min-height: 76px;
        flex-direction: row;
        justify-content: center;
      }

      .faixa-vermelha {
        top: 76px;
      }

      .carousel {
        height: calc(100svh - 82px);
        min-height: 520px;
        margin-top: 82px;
      }

      .overlay {
        gap: 14px;
      }

      .frase {
        padding: 0 24px;
      }

      .sidebar {
        top: 84px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-area">
      <img src="img/logo.png" alt="Logo JIREH MOTOS" />
      <h1>JIREH MOTOS</h1>
    </div>
    <div class="header-right">Concessionária de motos novas e seminovas</div>
  </header>

  <div class="faixa-vermelha"></div>              

  <div class="carousel" id="carousel">
    <img src="img/img1.jpeg" alt="Moto 1" class="active" />
    <img src="img/img2.jpeg" alt="Moto 2" />
    <img src="img/img3.jpeg" alt="Moto 3" />
    <img src="img/img4.jpeg" alt="Moto 4" /> 
    <img src="img/img5.jpeg" alt="Moto 5" />
    <img src="img/img6.jpeg" alt="Moto 6" />
    <img src="img/img7.jpeg" alt="Moto 7" />


    <div class="arrow left" id="prev"><i class="fas fa-chevron-left"></i></div>
    <div class="arrow right" id="next"><i class="fas fa-chevron-right"></i></div>

    <div class="overlay">
      <div class="frase">Seu sonho em duas rodas está aqui</div>
      <div class="saiba-mais">
        <a href="https://wa.me/5511989488282" target="_blank" rel="noopener noreferrer">SAIBA MAIS</a>
      </div>
      <button class="menu-btn" id="menuBtn">MENU</button>
    </div>
  </div>

  <nav class="sidebar" id="sidebar">
    <a href="index.html"><i class="fas fa-home"></i> Home</a>
    <a href="servicos.html"><i class="fas fa-tools"></i> Serviços</a>
    <a href="contato.html"><i class="fas fa-phone"></i> Contato</a>
  </nav>

  <script>
    const slides = document.querySelectorAll('.carousel img');
    let currentIndex = 0;
    let interval = setInterval(nextSlide, 3000);

    function showSlide(index) {
      slides.forEach(slide => slide.classList.remove('active'));
      slides[index].classList.add('active');
      document.getElementById('carousel').style.setProperty('--carousel-bg', `url("${slides[index].getAttribute('src')}")`);
    }

    showSlide(currentIndex);

    function nextSlide() {
      currentIndex = (currentIndex + 1) % slides.length;
      showSlide(currentIndex);
    }

    function prevSlide() {
      currentIndex = (currentIndex - 1 + slides.length) % slides.length;
      showSlide(currentIndex);
    }

    document.getElementById('next').addEventListener('click', () => { nextSlide(); resetInterval(); });
    document.getElementById('prev').addEventListener('click', () => { prevSlide(); resetInterval(); });

    function resetInterval() {
      clearInterval(interval);
      interval = setInterval(nextSlide, 3000);
    }

    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    menuBtn.addEventListener('click', e => {
      e.stopPropagation();
      sidebar.classList.toggle('active');
    });

    document.addEventListener('click', e => {
      if (!sidebar.contains(e.target) && !menuBtn.contains(e.target)) sidebar.classList.remove('active');
    });
  </script>
</body>
</html>
