<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIREH MOTOS</title>
  <meta name="description" content="Seu sonho em duas rodas está aqui - Concessionária de motos novas e seminovas.">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:'Montserrat', sans-serif;}
    body {background:#000; color:#fff; overflow-x:hidden; height:100vh;}

    /* CABEÇALHO FIXO */
    header {
      position:fixed;
      top:0;
      left:0;
      width:100%;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 30px;
      z-index:1000;
    }
    .logo-area {display:flex; align-items:center; gap:15px;}
    .logo-area img {height:60px;}
    .logo-area h1 {font-family:'Bebas Neue', sans-serif; font-size:2.8rem; color:#000; letter-spacing:2px;}
    .header-right {font-size:1.2rem; color:#bbb; font-weight:500;}
    
    /* FAIXA VERMELHA */
    .faixa-vermelha {
      width:100%;
      height:6px;
      background:#d40000;
      position:fixed;
      top:76px;
      left:0;
      z-index:999;
    }

    /* CARROSSEL */
    .carousel {
      position:relative;
      width:100%;
      height:100vh;
      margin-top:76px;
      overflow:hidden;
    }
    .carousel img {
      position:absolute;
      top:0; left:0;
      width:100%;
      height:100%;
      object-fit:cover;
      opacity:0;
      transition:opacity 1s ease-in-out;
    }
    .carousel img.active {opacity:1;}

    /* SETAS DO CARROSSEL */
    .arrow {
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      font-size:3rem;
      color:#fff;
      background:rgba(0,0,0,0.4);
      padding:10px;
      border-radius:50%;
      cursor:pointer;
      z-index:10;
      transition:0.3s;
      user-select:none;
    }
    .arrow:hover {background:rgba(212,0,0,0.8);}
    .arrow.left {left:20px;}
    .arrow.right {right:20px;}

    /* CONTEÚDO SOBRE O CARROSSEL */
    .overlay {
      position:absolute;
      bottom:50px;
      width:100%;
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:20px;
      animation: fadeInUp 1.5s ease forwards;
    }
    @keyframes fadeInUp {
      0% {opacity:0; transform:translateY(30px);}
      100% {opacity:1; transform:translateY(0);}
    }
    .frase {
      font-size:1.8rem;
      font-weight:600;
      font-style:italic;
      color:#fff;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
    }

    /* BOTÃO SAIBA MAIS - FAIXA LARGA */
    .saiba-mais {
      width:95%;          /* quase toda a largura da tela */
      max-width:none;     /* remove limite máximo */
      background:#d40000;
      text-align:center;
      padding:20px 0;
      border-radius:10px;
      transition:0.3s;
      box-shadow:0 5px 15px rgba(0,0,0,0.5);
      margin:0 auto;      /* centraliza horizontalmente */
    }
    .saiba-mais a {
      text-decoration:none;
      color:#fff;
      font-size:1.8rem;
      font-weight:700;
    }
    .saiba-mais:hover {
      transform:scale(1.05);
      box-shadow:0 0 30px rgba(255,0,0,0.7);
    }

    /* BOTÃO MENU MAIOR */
    .menu-btn {
      background:#fff;
      color:#000;
      border:none;
      padding:20px 60px;
      font-size:1.6rem;
      font-weight:bold;
      border-radius:12px;
      cursor:pointer;
      transition:0.3s;
      box-shadow:0 5px 15px rgba(0,0,0,0.5);
    }
    .menu-btn:hover {background:#d40000; color:#fff; box-shadow:0 0 30px rgba(255,0,0,0.7);}

    /* MENU LATERAL DIREITO, PEQUENO, MAIS PARA CIMA */
    .sidebar {
      position:fixed;
      top:20%; /* mais para cima do que o centro */
      right:-220px; /* fora da tela inicialmente */
      width:220px;
      background:#111;
      padding:1.5rem;
      border-radius:10px 0 0 10px;
      transition:0.4s;
      z-index:1001;
      display:flex;
      flex-direction:column;
      gap:1.5rem;
      height:auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .sidebar.active {right:0;}
    .sidebar a {
      color:#fff;
      font-size:1.2rem;
      text-decoration:none;
      font-weight:bold;
      transition:0.3s;
    }
    .sidebar a:hover {color:#d40000; transform:scale(1.05);}

    @media(max-width:900px){
      header {flex-direction:column; text-align:center;}
      .header-right {margin-top:5px;}
      .arrow {font-size:2.5rem;}
    }
  </style>
</head>

<body>

  <!-- CABEÇALHO FIXO -->
  <header>
    <div class="logo-area">
      <img src="img/logo.png" alt="Logo Jireh">
      <h1>JIREH MOTOS</h1>
    </div>
    <div class="header-right">Concessionária motos de novas e seminovas</div>
  </header>

  <!-- FAIXA VERMELHA -->
  <div class="faixa-vermelha"></div>

  <!-- CARROSSEL -->
  <div class="carousel" id="carousel">
    <img src="img/img1.png" class="active" alt="Moto 1">
    <img src="img/img2.png" alt="Moto 2">
    <img src="img/img3.png" alt="Moto 3">

    <!-- SETAS -->
    <div class="arrow left" id="prev"><i class="fas fa-chevron-left"></i></div>
    <div class="arrow right" id="next"><i class="fas fa-chevron-right"></i></div>

    <!-- CONTEÚDO SOBRE O CARROSSEL -->
    <div class="overlay">
      <div class="frase">Seu sonho em duas rodas está aqui</div>
      <div class="saiba-mais">
        <a href="https://wa.me/5511989488282" target="_blank">SAIBA MAIS</a>
      </div>
      <button class="menu-btn" id="menuBtn">MENU</button>
    </div>
  </div>

  <!-- MENU LATERAL DIREITO -->
  <div class="sidebar" id="sidebar">
    <a href="index.html"><i class="fas fa-home"></i> Home</a>
    <a href="servicos.html"><i class="fas fa-tools"></i> Serviços</a>
    <a href="contato.html"><i class="fas fa-phone"></i> Contato</a>
  </div>

  <script>
    const slides = document.querySelectorAll('.carousel img');
    let currentIndex = 0;
    let interval = setInterval(nextSlide, 3000);

    function showSlide(index){
      slides.forEach(slide => slide.classList.remove('active'));
      slides[index].classList.add('active');
    }

    function nextSlide(){
      currentIndex = (currentIndex + 1) % slides.length;
      showSlide(currentIndex);
    }

    function prevSlide(){
      currentIndex = (currentIndex - 1 + slides.length) % slides.length;
      showSlide(currentIndex);
    }

    document.getElementById('next').addEventListener('click', () => {
      nextSlide();
      resetInterval();
    });
    document.getElementById('prev').addEventListener('click', () => {
      prevSlide();
      resetInterval();
    });

    function resetInterval(){
      clearInterval(interval);
      interval = setInterval(nextSlide, 3000);
    }

    // MENU LATERAL
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    menuBtn.addEventListener('click', () => { sidebar.classList.toggle('active'); });
  </script>

</body>
</html>
