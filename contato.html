<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - Jireh Motos</title>
  <meta name="description" content="Contato Jireh Motos - envie sua mensagem, WhatsApp e redes sociais.">
  <link rel="icon" href="img/logo.jpg" type="image/jpg">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    /* Reset básico */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; scroll-behavior: smooth; }
    body { background: #000; color: #fff; overflow-x: hidden; }

    /* Cabeçalho fixo */
    header {
      position: fixed; top: 0; left: 0; width: 100%; height: 80px;
      background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; z-index: 1000;
    }
    .logo-header { display: flex; align-items: center; gap: 15px; }
    .logo-header img { height: 60px; }
    .logo-header h1 { color: #fff; font-size: 2rem; }

    /* Menu botão */
    .menu-btn { display: flex; flex-direction: column; align-items: center; gap: 5px; cursor: pointer; z-index: 1001; }
    .menu-btn span.bar { display: block; width: 35px; height: 4px; background: #fff; border-radius: 2px; transition: 0.3s; }
    .menu-btn span.bar1.active { transform: rotate(45deg) translate(6px,6px); }
    .menu-btn span.bar2.active { opacity: 0; }
    .menu-btn span.bar3.active { transform: rotate(-45deg) translate(7px,-7px); }
    .menu-btn .menu-text { color: #fff; font-size: 1.5rem; font-weight: bold; text-shadow: 0 0 12px #fff; }

    /* Menu lateral */
    .sidebar { position: fixed; top: 0; right: -250px; width: 250px; height: 100%; background: #111; padding: 2rem; transition: 0.4s; z-index: 1000; display: flex; flex-direction: column; gap: 2rem; }
    .sidebar.active { right: 0; }
    .sidebar a.menu-item { color: #fff; font-weight: bold; font-size: 1.3rem; text-decoration: none; display: flex; align-items: center; gap: 10px; transition: 0.3s; }
    .sidebar a.menu-item:hover { transform: scale(1.05); text-shadow: 0 0 12px #fff; }
    .sidebar a.menu-item i { transition: transform 0.3s, text-shadow 0.3s; }
    .sidebar a.menu-item:hover i { transform: scale(1.2) rotate(5deg); }

    /* Seção contato */
    main { margin-top: 100px; }
    .contact-section { text-align: center; padding: 4rem 1rem; }
    .contact-section h2 { font-size: 3rem; margin-bottom: 3rem; color: #fff; text-shadow: 0 0 15px #fff; }

    /* Links de contato */
    .contact-links { display: flex; flex-direction: column; align-items: center; gap: 2rem; margin-bottom: 4rem; }
    .contact-row { display: flex; flex-wrap: wrap; gap: 2rem; justify-content: center; }
    .contact-links a {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 1.6rem; color: #000; text-decoration: none;
      padding: 1rem 1.5rem; border-radius: 12px; background: #fff;
      box-shadow: 0 0 12px #fff; transition: 0.3s;
    }
    .contact-links a:hover { transform: scale(1.05); box-shadow: 0 0 20px #fff; }

    /* Formulário */
    .contact-form { max-width: 700px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
    .form-row { display: flex; gap: 1rem; flex-wrap: wrap; }
    .input-group { position: relative; flex: 1; }
    .input-group i { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); color: #000; font-size: 1.2rem; }
    input, textarea { width: 100%; padding: 1rem 1rem 1rem 3rem; border-radius: 12px; border: none; background: #fff; color: #000; font-size: 1.1rem; outline: none; transition: 0.3s; }
    input:focus, textarea:focus { box-shadow: 0 0 20px #fff; transform: scale(1.02); }
    textarea { min-height: 120px; resize: vertical; }

    button { padding: 1.2rem; background: #fff; color: #000; border: none; border-radius: 12px; font-size: 1.3rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
    button:hover { background: #ddd; transform: translateY(-2px); }

    .success-message {
      display: none; background: #fff; color: #000; padding: 1rem; border-radius: 12px;
      margin-top: 1rem; font-weight: bold; text-align: center;
      box-shadow: 0 0 12px #fff;
    }

    /* WhatsApp flutuante */
    .whatsapp-float { position: fixed; bottom: 30px; right: 30px; width: 70px; height: 70px; border-radius: 50%; background: #25D366; color: #fff; font-size: 2.5rem; display: flex; align-items: center; justify-content: center; z-index: 1000; transition: 0.3s; }
    .whatsapp-float:hover { transform: scale(1.2); }

    /* Responsivo */
    @media(max-width: 900px) { .form-row { flex-direction: column; } .contact-links a { font-size: 1.5rem; } }
  </style>
</head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="logo-header">
      <img src="img/logo.jpg" alt="Logo Jireh">
      <h1>Jireh Motos</h1>
    </div>
    <div class="menu-btn" id="menuBtn">
      <span class="bar bar1"></span>
      <span class="bar bar2"></span>
      <span class="bar bar3"></span>
      <span class="menu-text">MENU</span>
    </div>
  </header>

  <!-- MENU LATERAL -->
  <div class="sidebar" id="sidebar">
    <a href="index.html" class="menu-item"><i class="fas fa-motorcycle"></i> Início</a>
    <a href="servicos.html" class="menu-item"><i class="fas fa-tools"></i> Serviços</a>
    <a href="contato.html" class="menu-item"><i class="fas fa-phone-alt"></i> Contato</a>
  </div>

  <!-- CONTEÚDO -->
  <main>
    <section class="contact-section">
      <h2>Entre em Contato</h2>

      <!-- Links de contato -->
      <div class="contact-links">
        <div class="contact-row">
          <a href="https://wa.me/5511989488282" target="_blank"><i class="fab fa-whatsapp"></i> (11) 98948-8282</a>
          <a href="https://wa.me/5511945017680" target="_blank"><i class="fab fa-whatsapp"></i> (11) 94501-7680</a>
        </div>
        <div class="contact-row">
          <a href="https://www.instagram.com/jirehmotos1/" target="_blank"><i class="fab fa-instagram"></i> @jirehmotos1</a>
        </div>
        <div class="contact-row">
          <a href="https://www.google.com/maps/dir/?api=1&destination=Rua+Alferes+Bonilha+210,+São+Bernardo+do+Campo,+Brazil" target="_blank">
            <i class="fas fa-map-marker-alt"></i> Rua Alferes Bonilha, 210 - Centro - São Bernardo do Campo, SP
          </a>
        </div>
      </div>

      <!-- Formulário -->
      <form class="contact-form" id="contactForm">
        <div class="form-row">
          <div class="input-group"><i class="fa fa-user"></i><input type="text" name="name" placeholder="Seu nome" required></div>
          <div class="input-group"><i class="fa fa-phone"></i><input type="tel" name="phone" placeholder="Telefone" required></div>
        </div>
        <div class="form-row">
          <div class="input-group"><i class="fa fa-envelope"></i><input type="email" name="_replyto" placeholder="Seu e-mail" required></div>
        </div>
        <div class="form-row">
          <div class="input-group" style="flex: 1;"><i class="fa fa-comment"></i><textarea name="message" placeholder="Sua mensagem" required></textarea></div>
        </div>
        <button type="submit">Enviar</button>
        <div class="success-message" id="successMessage">Obrigado! Sua mensagem foi enviada com sucesso.</div>
      </form>
    </section>
  </main>

  <!-- WhatsApp flutuante -->
  <a href="https://wa.me/5511989488282" target="_blank" class="whatsapp-float">
    <i class="fab fa-whatsapp"></i>
  </a>

  <!-- JS -->
  <script>
    // MENU LATERAL
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    if(menuBtn && sidebar){
      menuBtn.addEventListener('click', e => {
        e.stopPropagation();
        sidebar.classList.toggle('active');
        menuBtn.querySelector('.bar1')?.classList.toggle('active');
        menuBtn.querySelector('.bar2')?.classList.toggle('active');
        menuBtn.querySelector('.bar3')?.classList.toggle('active');
      });
      document.addEventListener('click', e => {
        if(!sidebar.contains(e.target) && !menuBtn.contains(e.target)){
          sidebar.classList.remove('active');
          menuBtn.querySelector('.bar1')?.classList.remove('active');
          menuBtn.querySelector('.bar2')?.classList.remove('active');
          menuBtn.querySelector('.bar3')?.classList.remove('active');
        }
      });
    }

    // FORMULÁRIO DE CONTATO
    const form = document.getElementById('contactForm');
    const successMessage = document.getElementById('successMessage');
    if(form && successMessage){
      successMessage.style.display = 'none';
      form.addEventListener('submit', e => {
        e.preventDefault();
        successMessage.style.display = 'block';
        form.reset();
        setTimeout(() => { successMessage.style.display = 'none'; }, 5000);
      });
    }
  </script>

</body>
</html>
