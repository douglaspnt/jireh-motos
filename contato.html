<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - Jireh Motos</title>
  <meta name="description" content="Contato Jireh Motos - envie sua mensagem, WhatsApp e redes sociais.">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="img/logo.jpg" type="image/jpg">

  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:'Montserrat', sans-serif;}
    body {background:#000; color:#fff; overflow-x:hidden; min-height:100vh;}

    header {
      position:fixed;
      top:0;
      left:0;
      width:100%;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      min-height:82px;
      padding:10px clamp(14px, 4vw, 30px);
      z-index:1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      gap:12px;
    }
    .logo-area {display:flex; align-items:center; gap:12px; min-width:0;}
    .logo-area img {height:clamp(48px, 8vw, 60px); width:clamp(48px, 8vw, 60px); object-fit:contain;}
    .logo-area h1 {font-family:'Bebas Neue', sans-serif; font-size:clamp(2rem, 6vw, 2.8rem); color:#000; letter-spacing:2px; white-space:nowrap;}

    .faixa-vermelha {
      width:100%;
      height:6px;
      background:linear-gradient(90deg, #d40000, #ff4c4c);
      position:fixed;
      top:82px;
      left:0;
      z-index:999;
    }

    .sidebar {
      position:fixed;
      top:96px;
      right:min(-260px, -86vw);
      width:min(260px, 86vw);
      background:#111;
      padding:1.5rem;
      border-radius:10px 0 0 10px;
      transition:0.4s;
      z-index:1001;
      display:flex;
      flex-direction:column;
      gap:1.5rem;
    }
    .sidebar.active {right:0;}
    .sidebar a {color:#fff; font-size:1.2rem; text-decoration:none; font-weight:bold;}
    .sidebar a:hover {color:#d40000;}

    .menu-btn {
      background:#fff;
      color:#000;
      border:none;
      padding:12px clamp(22px, 6vw, 40px);
      font-size:clamp(0.95rem, 3vw, 1.2rem);
      font-weight:bold;
      border-radius:12px;
      cursor:pointer;
    }

    main {margin-top:88px;}
    .contact-section {text-align:center; padding:clamp(3rem, 8vw, 4rem) clamp(1rem, 4vw, 2rem) 6rem;}
    .contact-section h2 {font-size:clamp(2rem, 8vw, 3rem); margin-bottom:clamp(2rem, 7vw, 3rem); line-height:1.1;}

    .contact-row {
      display:flex;
      flex-wrap:wrap;
      gap:clamp(1rem, 3vw, 2rem);
      justify-content:center;
      max-width:980px;
      margin:0 auto 2rem;
    }
    .contact-row a {
      flex:1;
      min-width:min(100%, 260px);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:0.5rem;
      font-size:clamp(1rem, 3.8vw, 1.6rem);
      color:#000;
      text-decoration:none;
      padding:clamp(1rem, 4vw, 1.5rem);
      border-radius:8px;
      background:#fff;
      line-height:1.25;
      overflow-wrap:anywhere;
    }

    .contact-form {max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:1.5rem;}
    .form-row {display:flex; gap:1rem; flex-wrap:wrap;}
    .input-group {position:relative; flex:1 1 260px;}
    .input-group i {position:absolute; top:50%; left:15px; transform:translateY(-50%); color:#000;}
    input, textarea {
      width:100%;
      padding:clamp(1rem, 4vw, 1.5rem) 1rem clamp(1rem, 4vw, 1.5rem) 3rem;
      border-radius:8px;
      border:none;
      background:#fff;
      color:#000;
      font-size:clamp(1rem, 3.5vw, 1.2rem);
    }
    textarea {min-height:150px;}

    button {
      padding:clamp(1rem, 4vw, 1.5rem);
      background:#fff;
      color:#000;
      border:none;
      border-radius:8px;
      font-size:clamp(1rem, 3.5vw, 1.3rem);
      font-weight:bold;
      cursor:pointer;
    }

    .whatsapp-float {
      position:fixed;
      bottom:clamp(18px, 4vw, 30px);
      right:clamp(18px, 4vw, 30px);
      width:clamp(56px, 14vw, 70px);
      height:clamp(56px, 14vw, 70px);
      border-radius:50%;
      background:#25D366;
      color:#fff;
      font-size:clamp(2rem, 8vw, 2.5rem);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:1000;
    }

    @media(max-width:600px){
      header {min-height:76px;}
      .logo-area h1 {letter-spacing:1px;}
      .menu-btn {padding:10px 16px;}
      .faixa-vermelha {top:76px;}
      .sidebar {top:84px;}
      main {margin-top:82px;}
      .contact-row {margin-bottom:1rem;}
    }

    @media(max-width:380px){
      header {padding-left:10px; padding-right:10px;}
      .logo-area {gap:8px;}
      .menu-btn {font-size:0.85rem; padding:9px 12px;}
    }
  </style>
</head>
<body>

<header>
  <div class="logo-area">
    <img src="img/logo.png" alt="Logo Jireh">
    <h1>JIREH MOTOS</h1>
  </div>
  <button class="menu-btn" id="menuBtn">MENU</button>
</header>

<div class="faixa-vermelha"></div>

<div class="sidebar" id="sidebar">
  <a href="index.html"><i class="fas fa-home"></i> Home</a>
  <a href="servicos.html"><i class="fas fa-tools"></i> Serviços</a>
  <a href="contato.html"><i class="fas fa-phone-alt"></i> Contato</a>
</div>

<main>

    </div>

<div class="contact-row">
   <a href="https://www.google.com/maps/dir/?api=1&destination=Rua+Alferes+Bonilha+210,+São+Bernardo+do+Campo,+Brazil" target="_blank"> 
    <i class="fas fa-map-marker-alt"></i> Rua Alferes Bonilha, 210 – São Bernardo do Campo </a> </div>


 <div class="contact-row">
  <a href="https://www.google.com/maps/dir/?api=1&destination=Av.+Cupecê+3491,+Jardim+Prudência,+São+Paulo,+SP" target="_blank">

    <!-- FORMULÁRIO COM ENVIO REAL -->
    <form class="contact-form"
          action="https://formsubmit.co/jirehmotos0@gmail.com"

      <input type="hidden" name="_captcha" value="false">

        <div class="input-group"><i class="fa fa-phone"></i><input type="tel" name="Telefone" placeholder="Telefone" required></div>
      </div>

      <div class="form-row">
        <div class="input-group"><i class="fa fa-envelope"></i><input type="email" name="Email" placeholder="Seu e-mail" required></div>
      </div>

      <div class="form-row">
        <div class="input-group"><i class="fa fa-comment"></i><textarea name="Mensagem" placeholder="Sua mensagem" required></textarea></div>
      </div>

      <button type="submit">Enviar</button>
    </form>
  </section>
</main>

<a href="https://wa.me/5511989488282" target="_blank" class="whatsapp-float">
  <i class="fab fa-whatsapp"></i>
</a>

<script>
  const menuBtn = document.getElementById('menuBtn');
  const sidebar = document.getElementById('sidebar');

  menuBtn.addEventListener('click', e=>{
    e.stopPropagation();
    sidebar.classList.toggle('active');
  });

  document.addEventListener('click', e=>{
    if(!sidebar.contains(e.target) && !menuBtn.contains(e.target)){
      sidebar.classList.remove('active');
    }
  });
</script>

</body>
</html>
