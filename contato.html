<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - Jireh Motos</title>
  <meta name="description" content="Contato Jireh Motos - envie sua mensagem, WhatsApp e redes sociais.">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="img/logo.jpg" type="image/jpg">

  <style>
    /* RESET E GERAL */
    * {margin:0; padding:0; box-sizing:border-box; font-family:'Montserrat', sans-serif;}
    body {background:#000; color:#fff; overflow-x:hidden; min-height:100vh;}

    /* CABEÇALHO FIXO */
    header {
      position:fixed;
      top:0;
      left:0;
      width:100%;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 30px;
      z-index:1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .logo-area {display:flex; align-items:center; gap:15px;}
    .logo-area img {height:60px;}
    .logo-area h1 {font-family:'Bebas Neue', sans-serif; font-size:2.8rem; color:#000; letter-spacing:2px;}

    /* FAIXA VERMELHA */
    .faixa-vermelha {
      width:100%;
      height:6px;
      background:linear-gradient(90deg, #d40000, #ff4c4c);
      position:fixed;
      top:76px;
      left:0;
      z-index:999;
      animation: moveGradient 5s linear infinite;
    }
    @keyframes moveGradient {0%{background-position:0% 0%;} 100%{background-position:100% 0%;}}

    /* MENU LATERAL DIREITO */
    .sidebar {
      position:fixed;
      top:15%;
      right:-220px;
      width:220px;
      background:#111;
      padding:1.5rem;
      border-radius:10px 0 0 10px;
      transition:0.4s;
      z-index:1001;
      display:flex;
      flex-direction:column;
      gap:1.5rem;
      height:auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }
    .sidebar.active {right:0;}
    .sidebar a {
      color:#fff;
      font-size:1.2rem;
      text-decoration:none;
      font-weight:bold;
      transition:0.3s;
    }
    .sidebar a:hover {color:#d40000; transform:scale(1.05);}

    /* MENU BOTÃO */
    .menu-btn {
      background:#fff;
      color:#000;
      border:none;
      padding:15px 40px;
      font-size:1.2rem;
      font-weight:bold;
      border-radius:12px;
      cursor:pointer;
      transition:0.3s;
      box-shadow:0 5px 15px rgba(0,0,0,0.5);
    }
    .menu-btn:hover {background:#d40000; color:#fff; box-shadow:0 0 30px rgba(255,0,0,0.7);}

    /* SEÇÃO CONTATO */
    main {margin-top:100px;}
    .contact-section {text-align:center; padding:4rem 1rem;}
    .contact-section h2 {font-size:3rem; margin-bottom:3rem; color:#fff; text-shadow:0 0 15px #fff;}

    /* LINKS DE CONTATO */
    .contact-links {display:flex; flex-direction:column; align-items:center; gap:2rem; margin-bottom:4rem;}
    .contact-row {
      display:flex;
      flex-wrap:wrap;
      gap:2rem;
      justify-content:center;
      width:100%;
      max-width:900px;
      margin:0 auto;
    }
    .contact-row a {
      flex:1;
      min-width:250px;
      display:flex; 
      align-items:center; 
      justify-content:center;
      gap:0.5rem;
      font-size:1.6rem; 
      color:#000; 
      text-decoration:none;
      padding:1.5rem 1.5rem; 
      border-radius:12px; 
      background:#fff;
      box-shadow:0 0 12px #fff; 
      transition:0.3s;
    }
    .contact-row a:hover {transform:scale(1.05); box-shadow:0 0 20px #fff;}

    /* FORMULÁRIO */
    .contact-form {max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:1.5rem;}
    .form-row {display:flex; gap:1rem; flex-wrap:wrap;}
    .input-group {position:relative; flex:1;}
    .input-group i {position:absolute; top:50%; left:15px; transform:translateY(-50%); color:#000; font-size:1.2rem;}
    input, textarea {width:100%; padding:1.5rem 1rem 1.5rem 3rem; border-radius:12px; border:none; background:#fff; color:#000; font-size:1.2rem; outline:none; transition:0.3s;}
    input:focus, textarea:focus {box-shadow:0 0 20px #fff; transform:scale(1.02);}
    textarea {min-height:150px; resize:vertical;}

    button {padding:1.5rem; background:#fff; color:#000; border:none; border-radius:12px; font-size:1.3rem; font-weight:bold; cursor:pointer; transition:0.3s;}
    button:hover {background:#ddd; transform:translateY(-2px);}

    .success-message {
      display:none; background:#fff; color:#000; padding:1rem; border-radius:12px;
      margin-top:1rem; font-weight:bold; text-align:center;
      box-shadow:0 0 12px #fff;
    }

    /* WHATSAPP FLUTUANTE */
    .whatsapp-float {position:fixed; bottom:30px; right:30px; width:70px; height:70px; border-radius:50%; background:#25D366; color:#fff; font-size:2.5rem; display:flex; align-items:center; justify-content:center; z-index:1000; transition:0.3s;}
    .whatsapp-float:hover {transform:scale(1.2);}

    /* RESPONSIVO */
    @media(max-width:1024px){
      .form-row{flex-direction:column;} 
      .contact-row a{font-size:1.4rem; padding:1rem 1.2rem;}
    }
    @media(max-width:600px){
      .contact-row a{font-size:1.2rem; padding:0.8rem 1rem;}
      .contact-row {flex-direction:column; align-items:center;}
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO -->
  <header>
    <div class="logo-area">
      <img src="img/logo.png" alt="Logo Jireh">
      <h1>JIREH MOTOS</h1>
    </div>
    <button class="menu-btn" id="menuBtn">MENU</button>
  </header>

  <!-- FAIXA VERMELHA -->
  <div class="faixa-vermelha"></div>

  <!-- MENU LATERAL -->
  <div class="sidebar" id="sidebar">
    <a href="index.html"><i class="fas fa-home"></i> Home</a>
    <a href="servicos.html"><i class="fas fa-tools"></i> Serviços</a>
    <a href="contato.html"><i class="fas fa-phone-alt"></i> Contato</a>
  </div>

  <!-- CONTEÚDO CONTATO -->
  <main>
    <section class="contact-section">
      <h2>Entre em Contato</h2>

      <!-- LINKS DE CONTATO -->
      <div class="contact-links">
        <!-- Linha 1: WhatsApp e Instagram -->
        <div class="contact-row">
          <a href="https://wa.me/5511989488282" target="_blank"><i class="fab fa-whatsapp"></i> (11) 98948-8282</a>
          <a href="https://wa.me/5511945017680" target="_blank"><i class="fab fa-whatsapp"></i> (11) 94501-7680</a>
          <a href="https://www.instagram.com/jirehmotos1/" target="_blank"><i class="fab fa-instagram"></i> @jirehmotos1</a>
        </div>

        <!-- Linha 2: Endereço alinhado com cards acima -->
        <div class="contact-row">
          <a href="https://www.google.com/maps/dir/?api=1&destination=Rua+Alferes+Bonilha+210,+São+Bernardo+do+Campo,+Brazil" target="_blank">
            <i class="fas fa-map-marker-alt"></i> Rua Alferes Bonilha, 210 - Centro - São Bernardo do Campo, SP
          </a>
        </div>
      </div>

      <!-- FORMULÁRIO -->
      <form class="contact-form" id="contactForm">
        <div class="form-row">
          <div class="input-group"><i class="fa fa-user"></i><input type="text" name="name" placeholder="Seu nome" required></div>
          <div class="input-group"><i class="fa fa-phone"></i><input type="tel" name="phone" placeholder="Telefone" required></div>
        </div>
        <div class="form-row">
          <div class="input-group"><i class="fa fa-envelope"></i><input type="email" name="_replyto" placeholder="Seu e-mail" required></div>
        </div>
        <div class="form-row">
          <div class="input-group" style="flex:1;"><i class="fa fa-comment"></i><textarea name="message" placeholder="Sua mensagem" required></textarea></div>
        </div>
        <button type="submit">Enviar</button>
        <div class="success-message" id="successMessage">Obrigado! Sua mensagem foi enviada com sucesso.</div>
      </form>
    </section>
  </main>

  <!-- WHATSAPP FLUTUANTE -->
  <a href="https://wa.me/5511989488282" target="_blank" class="whatsapp-float">
    <i class="fab fa-whatsapp"></i>
  </a>

  <!-- JS -->
  <script>
    // MENU LATERAL
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');

    menuBtn.addEventListener('click', e=>{
      e.stopPropagation();
      sidebar.classList.toggle('active');
    });

    document.addEventListener('click', e=>{
      if(!sidebar.contains(e.target) && !menuBtn.contains(e.target)){
        sidebar.classList.remove('active');
      }
    });

    // FORMULÁRIO
    const form = document.getElementById('contactForm');
    const successMessage = document.getElementById('successMessage');
    form.addEventListener('submit', e=>{
      e.preventDefault();
      successMessage.style.display='block';
      form.reset();
      setTimeout(()=>{successMessage.style.display='none';},5000);
    });
  </script>

</body>
</html>
